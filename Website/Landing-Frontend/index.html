<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#5B5FEF" />
    <meta name="google-site-verification" content="WfJyUD2-TvGjz_28c1Yx_CffiIf8jl_Hg78RLWNowqU" />
    <!-- GA4 (G-4J3T6LLDB5) + Consent Mode v2. /gtag-init.js sets consent to denied
         and only loads gtag.js after the visitor accepts analytics, so there is
         deliberately no googletagmanager <script> tag here (it would bypass consent). -->
    <script src="/gtag-init.js?v=2"></script>
    <!-- Page-specific title/description/canonical/OG/Twitter/JSON-LD tags:
         injected here as a literal string by server.js/scripts/prerender.js
         in production. During `npm run dev` this comment is left as-is (no
         server in front of plain `vite`) and each page's own <Seo>/<title>
         is hoisted into <head> by React after hydration instead, this
         placeholder is intentionally the only <title> source, so the two
         paths never produce duplicate tags. -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-tail-->
    <!--
      Shown only while a client-only route (auth/dashboard) is still
      rendering into an empty #root, entry-client.jsx removes it right
      after mount. Prerendered/SSR'd routes already have real markup in
      #root by the time this paints, so entry-client.jsx removes it
      immediately for those instead of waiting.
    -->
    <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F7F8FC;z-index:9999;">
      <img src="/images/logo.png" alt="Mzobs" width="180" style="width:180px;height:auto;mix-blend-mode:multiply;animation:mzobs-fade 0.5s ease both;" />
      <div style="width:120px;height:3px;border-radius:999px;background:#E3E7EE;overflow:hidden;">
        <div style="width:40%;height:100%;border-radius:999px;background:#0b7a6d;animation:mzobs-slide 1.1s ease-in-out infinite;"></div>
      </div>
      <!-- Dussehra extras: hidden unless the inline script below finds today inside the festival window. -->
      <div id="dussehra-loader" style="display:none;flex-direction:column;align-items:center;gap:6px;">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M10 42 q22 22 44 0 z" fill="#c2410c" />
          <path d="M32 40 q-9 -13 0 -30 q9 17 0 30 z" fill="#fbbf24" style="transform-origin:32px 40px;animation:mzobs-flame 1.3s ease-in-out infinite;" />
          <path d="M32 38 q-4 -7 0 -15 q4 8 0 15 z" fill="#fff7ed" style="transform-origin:32px 38px;animation:mzobs-flame 1.3s ease-in-out infinite;" />
        </svg>
        <div style="font:600 14px/1.3 system-ui,sans-serif;color:#9a3412;letter-spacing:.04em;">Happy Dussehra!</div>
        <div style="font:500 12.5px/1.3 system-ui,sans-serif;color:#c2410c;">विजयादशमी की शुभकामनाएँ</div>
      </div>
    </div>
    <script>
      (function () {
        var n = new Date();
        if (n >= new Date(2026, 9, 20) && n < new Date(2026, 9, 25)) {
          var l = document.getElementById('initial-loader');
          l.style.background = 'linear-gradient(180deg,#fff7ed,#ffedd5)';
          document.getElementById('dussehra-loader').style.display = 'flex';
          // First open of the session: entry-client.jsx keeps this splash up for a
          // moment even though the page itself is ready (see removeLoader there).
          try {
            if (!sessionStorage.getItem('mzobs-dussehra-splash')) {
              sessionStorage.setItem('mzobs-dussehra-splash', '1');
              window.__dussehraSplash = true;
            }
          } catch (e) { window.__dussehraSplash = true; }
        }
      })();
    </script>
    <style>
      @keyframes mzobs-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes mzobs-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @keyframes mzobs-flame { 0%,100% { transform: scale(1,1); } 50% { transform: scale(.9,1.18); } }
      @media (prefers-reduced-motion: reduce) { #initial-loader * { animation: none !important; } }
    </style>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
