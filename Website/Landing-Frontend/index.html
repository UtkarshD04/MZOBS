<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="google-site-verification" content="WfJyUD2-TvGjz_28c1Yx_CffiIf8jl_Hg78RLWNowqU" />
    <!-- Page-specific title/description/canonical/OG/Twitter/JSON-LD tags:
         injected here as a literal string by server.js/scripts/prerender.js
         in production. During `npm run dev` this comment is left as-is (no
         server in front of plain `vite`) and each page's own <Seo>/<title>
         is hoisted into <head> by React after hydration instead — this
         placeholder is intentionally the only <title> source, so the two
         paths never produce duplicate tags. -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-tail-->
    <!--
      Shown only while a client-only route (auth/dashboard) is still
      rendering into an empty #root — entry-client.jsx removes it right
      after mount. Prerendered/SSR'd routes already have real markup in
      #root by the time this paints, so entry-client.jsx removes it
      immediately for those instead of waiting.
    -->
    <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F7F9FC;z-index:9999;">
      <div style="width:32px;height:32px;border-radius:50%;border:3px solid #D7EEE7;border-top-color:#0B7A6D;animation:mzobs-spin 0.7s linear infinite;"></div>
      <span style="font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:14px;color:#16324F;letter-spacing:0.02em;">MZOBS</span>
    </div>
    <style>
      @keyframes mzobs-spin { to { transform: rotate(360deg); } }
    </style>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
