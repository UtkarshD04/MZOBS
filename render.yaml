services:
  - type: web
    name: employee-dashboard
    runtime: static
    rootDir: Website/Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FILE_BASE_URL
        sync: false
      - key: VITE_LANDING_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: employer-dashboard
    runtime: static
    rootDir: Website/Employer-Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_LANDING_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: admin-dashboard
    runtime: static
    rootDir: Website/Company-Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FILE_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Was `runtime: static` — switched to a Node web service because SEO/SSR
  # needs a live process: /jobs/:id is rendered per-request against the
  # public jobs API, and /sitemap.xml is generated dynamically. Both need a
  # Node runtime a static site can't provide.
  - type: web
    name: mzobs-landing
    runtime: node
    rootDir: Website/Landing-Frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_EMPLOYEE_APP_URL
        sync: false
      - key: VITE_EMPLOYER_APP_URL
        sync: false
      - key: VITE_EMPLOYER_API_URL
        sync: false
      - key: VITE_EMPLOYEE_API_URL
        sync: false
      - key: VITE_CONTACT_API_URL
        sync: false
      - key: VITE_PUBLIC_JOBS_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_MSG91_WIDGET_ID
        sync: false
      - key: VITE_MSG91_TOKEN_AUTH
        sync: false
      # Same backend jobs API as VITE_PUBLIC_JOBS_API_URL above, without the
      # VITE_ prefix — server.js reads this directly at request time (Vite
      # only inlines VITE_-prefixed vars into the client bundle at build
      # time, so the Node process needs its own copy). Set it to the same
      # value as VITE_PUBLIC_JOBS_API_URL in the Render dashboard.
      - key: PUBLIC_JOBS_API_URL
        sync: false
